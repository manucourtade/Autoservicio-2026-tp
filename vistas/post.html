<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear</title>

    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <script defer src="js/crearProd.js"></script>

    <!-- Ruta archivo CSS externo -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

   <header>

        <div class="logo-contenedor">
            <img src="assets/Logo.png" alt="Logo autoservicio" id="logo">
        </div>

        <nav class="nav-bar">
            <ul>
                <li class="nav-item"><a href="index.html">Ver productos</a></li>
                <li class="nav-item"><a href="get.html">Encontrar producto</a></li>
                <li class="nav-item"><a href="post.html">Nuevo producto</a></li>
                <li class="nav-item"><a href="put.html">Modificar producto</a></li>
                <li class="nav-item"><a href="delete.html">Eliminar producto</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- Formulario POST product -->
        <section class="createProduct-container">

            <h2>Crear producto</h2>

            <form id="createProductForm">

                <label for="categoryProd">Categoria</label>
                <select name="category" id="categoryProd" required>
                    <option value="food">Comida</option>
                    <option value="drink">Bebida</option>
                </select>

                <label for="imageProd">Imagen</label>
                <input type="text" name="image" id="imageProd" required>

                <label for="nameProd">Nombre</label>
                <input type="text" name="name" id="nameProd" required>

                <label for="priceProd">Precio</label>
                <input type="number" name="price" id="priceProd" min="1" required>

                <input type="submit" value="Crear producto">

            </form>

        </section>
        <section id="contenedor-productos"></section>
    </main>
